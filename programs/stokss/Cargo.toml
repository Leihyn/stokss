[package]
name = "stokss"
version = "0.1.0"
edition = "2021"
# Matches the Solana BPF toolchain (platform-tools v1.51 ships rustc 1.84.1), so dependency
# resolution never selects a crate the build toolchain cannot parse.
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "stokss"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
